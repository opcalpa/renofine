
[functions.ai-design]
enabled = true
verify_jwt = true
import_map = "./functions/ai-design/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-design/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-design/*.html" ]

[functions.help-bot]
enabled = true
verify_jwt = false
entrypoint = "./functions/help-bot/index.ts"

[functions.pinterest-oembed]
enabled = true
verify_jwt = false
entrypoint = "./functions/pinterest-oembed/index.ts"

[functions.translate-comments]
enabled = true
verify_jwt = false
entrypoint = "./functions/translate-comments/index.ts"

[functions.send-project-invitation]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-project-invitation/index.ts"

[functions.send-quote-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-quote-email/index.ts"

[functions.parse-renovation-description]
enabled = true
verify_jwt = false
entrypoint = "./functions/parse-renovation-description/index.ts"

# Reads a document a signed-in person dropped. It has always required a JWT —
# stated here so a deploy can never quietly relax it (the s82 lesson: a deploy
# flag IS a security setting).
[functions.classify-document]
enabled = true
verify_jwt = true
entrypoint = "./functions/classify-document/index.ts"

[functions.extract-property-document]
enabled = true
verify_jwt = true
entrypoint = "./functions/extract-property-document/index.ts"

# --- Functions that sign storage URLs on a caller's behalf ---------------
# The worker and intake functions answer callers who have no session at all:
# they carry an invite token, which the function itself validates. They must
# therefore run without JWT verification, and each one checks its token before
# doing anything.

[functions.get-worker-data]
enabled = true
verify_jwt = false
entrypoint = "./functions/get-worker-data/index.ts"

[functions.worker-upload-photo]
enabled = true
verify_jwt = false
entrypoint = "./functions/worker-upload-photo/index.ts"

[functions.worker-send-message]
enabled = true
verify_jwt = false
entrypoint = "./functions/worker-send-message/index.ts"

[functions.worker-create-purchase]
enabled = true
verify_jwt = false
entrypoint = "./functions/worker-create-purchase/index.ts"

[functions.worker-send-report]
enabled = true
verify_jwt = false
entrypoint = "./functions/worker-send-report/index.ts"

[functions.ata-approval]
enabled = true
verify_jwt = false
entrypoint = "./functions/ata-approval/index.ts"

[functions.worker-retract-report]
enabled = true
verify_jwt = false
entrypoint = "./functions/worker-retract-report/index.ts"

[functions.worker-acknowledge]
enabled = true
verify_jwt = false
entrypoint = "./functions/worker-acknowledge/index.ts"

[functions.intake-upload]
enabled = true
verify_jwt = false
entrypoint = "./functions/intake-upload/index.ts"

# proxy-image is only ever called from a signed-in session (the Pinterest
# import), so it verifies the JWT — without it, anyone could push files into
# any project's storage prefix.
[functions.proxy-image]
enabled = true
verify_jwt = true
entrypoint = "./functions/proxy-image/index.ts"
