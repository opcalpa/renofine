<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Renaida · avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1A1A17; --paper:#FAFAF7; --green:#2F5D4E; --rust:#B5341E; --gold:#A8845C;
    --s0:#FAFAF7; --s1:#F5F2E8; --s2:#EFEAE0; --hair:#E8E4D8;
    --fg:#29261B; --muted:#585548; --subtle:#8A8576;
    --disp:"Fraunces",Georgia,serif; --ui:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:1080px;margin:0 auto;padding:64px 40px 120px;}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);}
  h1{font-family:var(--disp);font-weight:300;font-size:76px;line-height:.98;letter-spacing:-.01em;margin:14px 0 0;color:var(--ink);}
  .lede{font-size:18px;color:var(--muted);max-width:52ch;margin:18px 0 0;}
  .lede b{color:var(--fg);font-weight:600;}
  h2{font-family:var(--disp);font-weight:400;font-size:30px;margin:0 0 6px;color:var(--ink);letter-spacing:-.01em;}
  .sec-sub{color:var(--subtle);font-size:14px;margin:0 0 26px;max-width:60ch;}
  section{margin-top:84px;}

  /* ── hero ── */
  .hero{margin-top:44px;display:grid;grid-template-columns:340px 1fr;gap:0;border:1px solid var(--hair);border-radius:16px;overflow:hidden;background:var(--s1);}
  .hero-stage{background:radial-gradient(120% 120% at 50% 30%, #fff 0%, var(--s1) 70%);display:flex;align-items:center;justify-content:center;padding:40px;cursor:crosshair;border-right:1px solid var(--hair);}
  .hero-side{padding:38px 40px;display:flex;flex-direction:column;gap:22px;background:var(--paper);}
  .bubble{position:relative;background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 20px;font-size:17px;line-height:1.45;max-width:38ch;align-self:flex-start;}
  .bubble::after{content:"";position:absolute;left:-8px;top:22px;width:16px;height:16px;background:var(--ink);transform:rotate(45deg);border-radius:2px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-family:var(--ui);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--hair);background:var(--paper);color:var(--muted);cursor:pointer;transition:all .16s;}
  .chip:hover{border-color:var(--green);color:var(--green);}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;}
  .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);}

  /* ── gallery ── */
  .gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .card{border:1px solid var(--hair);border-radius:14px;background:var(--paper);padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
  .card .stagec{height:104px;display:flex;align-items:center;justify-content:center;}
  .card .lab{font-family:var(--disp);font-size:19px;color:var(--ink);margin-top:6px;}
  .card .use{font-size:12.5px;color:var(--subtle);line-height:1.4;}

  /* ── in-app demo ── */
  .demo{border:1px solid var(--hair);border-radius:16px;overflow:hidden;box-shadow:var(--rf-shadow-lg,0 18px 50px rgba(26,26,23,.12));background:var(--paper);position:relative;}
  .app-nav{display:flex;align-items:center;gap:28px;padding:16px 24px;border-bottom:1px solid var(--hair);background:var(--paper);}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-size:22px;color:var(--ink);}
  .app-nav .links{display:flex;gap:22px;margin-left:8px;font-size:14px;color:var(--muted);}
  .app-nav .links span{cursor:default;}
  .app-nav .links span.act{color:var(--ink);font-weight:600;}
  .app-nav .right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .newbtn{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .16s;}
  .newbtn .plus{font-size:16px;line-height:1;}
  .newbtn.pulse{animation:rn-pulse 1.1s ease-in-out infinite;}
  @keyframes rn-pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,93,78,.45);transform:translateY(0)}50%{box-shadow:0 0 0 8px rgba(47,93,78,0);transform:translateY(-1px)}}
  .avatar-chip{width:30px;height:30px;border-radius:50%;background:var(--s2);}
  .app-body{padding:34px 34px 92px;min-height:320px;background:var(--s0);}
  .app-body h3{font-family:var(--disp);font-weight:400;font-size:24px;margin:0 0 4px;color:var(--ink);}
  .app-body .sub{color:var(--subtle);font-size:13.5px;margin:0 0 22px;}
  .empty{border:1.5px dashed var(--hair);border-radius:12px;padding:44px;text-align:center;color:var(--subtle);}
  .empty .big{font-family:var(--disp);font-size:20px;color:var(--muted);margin-bottom:6px;}
  .rows{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--hair);border-radius:11px;background:var(--paper);animation:rn-in .4s ease both;}
  @keyframes rn-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .row .rname{font-family:var(--disp);font-size:17px;color:var(--ink);}
  .row .rmeta{font-size:12.5px;color:var(--subtle);}
  .row .rstatus{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--rf-green-soft,#eef2f0);padding:5px 10px;border-radius:999px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  /* Renaida launcher docked in demo */
  .launcher{position:absolute;right:22px;bottom:22px;display:flex;align-items:flex-end;gap:14px;flex-direction:row-reverse;}
  .launcher .pod{width:72px;height:72px;border-radius:50%;background:var(--paper);border:1px solid var(--hair);box-shadow:0 8px 24px rgba(26,26,23,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .launcher .say{background:var(--ink);color:var(--paper);border-radius:14px;padding:15px 18px;max-width:280px;font-size:14.5px;line-height:1.45;box-shadow:0 8px 24px rgba(26,26,23,.16);position:relative;}
  .launcher .say::after{content:"";position:absolute;right:-7px;bottom:22px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);border-radius:2px;}
  .launcher .say .step-nav{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .launcher .say button{font-family:var(--ui);font-size:12.5px;font-weight:600;border:none;border-radius:7px;padding:7px 13px;cursor:pointer;}
  .launcher .say .next{background:var(--paper);color:var(--ink);}
  .launcher .say .skip{background:transparent;color:var(--subtle);padding:7px 4px;}
  .launcher .say .prog{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--subtle);letter-spacing:.1em;}

  /* construction footer */
  .constr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .constr .c{border:1px solid var(--hair);border-radius:14px;background:var(--paper);padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .constr .c .cap{font-size:12.5px;color:var(--subtle);text-align:center;line-height:1.45;}
  .swatches{display:flex;gap:10px;margin-top:6px;}
  .sw{width:36px;height:36px;border-radius:8px;border:1px solid var(--hair);}

  .namebox{margin-top:26px;border-left:3px solid var(--green);background:var(--rf-green-soft,#eef2f0);padding:16px 20px;border-radius:0 10px 10px 0;max-width:60ch;font-size:14.5px;color:var(--fg);}
  .namebox b{color:var(--green);}

  /* ─────────  Renaida avatar keyframes  ───────── */
  @media (prefers-reduced-motion: no-preference){
    .rn{animation:rn-float 3.6s ease-in-out infinite;}
    .rn-eye{transform-box:fill-box;transform-origin:center;animation:rn-blink 4.8s ease-in-out infinite;}
    .rn--sleep{animation:rn-float 6s ease-in-out infinite;}
    .rn--talk .rn-head{transform-box:fill-box;transform-origin:center;animation:rn-nod .9s ease-in-out infinite;}
    .rn--hello .rn-head{transform-box:fill-box;transform-origin:50% 82%;animation:rn-wave .8s ease-in-out infinite;}
    .rn--happy .rn-head{transform-box:fill-box;transform-origin:center;animation:rn-hop .72s ease-in-out infinite;}
    .rn--think .rn-dots circle{transform-box:fill-box;transform-origin:center;animation:rn-dot 1.4s ease-in-out infinite;}
    .rn--think .rn-dots circle:nth-child(2){animation-delay:.18s;}
    .rn--think .rn-dots circle:nth-child(3){animation-delay:.36s;}
    .rn--talk .rn-sound path{animation:rn-snd .9s ease-in-out infinite;}
    .rn--talk .rn-sound path:nth-child(2){animation-delay:.2s;}
    .rn-spark-a,.rn-spark-b{transform-box:fill-box;transform-origin:center;}
    .rn--hello .rn-spark-a,.rn--happy .rn-spark-a{animation:rn-tw 1.3s ease-in-out infinite;}
    .rn--hello .rn-spark-b,.rn--happy .rn-spark-b{animation:rn-tw 1.3s ease-in-out .45s infinite;}
    .rn--sleep .rn-z1{transform-box:fill-box;transform-origin:center;animation:rn-z 2.4s ease-in-out infinite;}
    .rn--sleep .rn-z2{transform-box:fill-box;transform-origin:center;animation:rn-z 2.4s ease-in-out .5s infinite;}
  }
  .rn-dots,.rn-sound,.rn-spark,.rn-zzz{opacity:0;}
  .rn--think .rn-dots{opacity:1;}
  .rn--talk .rn-sound{opacity:1;}
  .rn--hello .rn-spark,.rn--happy .rn-spark{opacity:1;}
  .rn--sleep .rn-zzz{opacity:1;}
  @keyframes rn-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes rn-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}97%{transform:scaleY(1)}}
  @keyframes rn-nod{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  @keyframes rn-wave{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
  @keyframes rn-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(-2px)}}
  @keyframes rn-dot{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:1;transform:translateY(-1px)}}
  @keyframes rn-snd{0%,100%{opacity:.2}50%{opacity:.9}}
  @keyframes rn-tw{0%,100%{opacity:.15;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
  @keyframes rn-z{0%{opacity:0;transform:translateY(5px)}30%{opacity:1}100%{opacity:0;transform:translateY(-7px)}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="renaida/renaida-avatar.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const Avatar = window.RenaidaAvatar;

// tiny static Skåra mark for the app nav
function SkaraMark({ size = 26, color = "#1A1A17" }){
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none">
      <path d="M32 6 a26 26 0 1 0 26 26 h-12 v-14 h-14 z" fill={color} />
    </svg>
  );
}

const HERO_STATES = [
  { key:"hello", label:"Hälsar", msg:"Hej! Jag är Renaida — din assistent i Renofine." },
  { key:"idle",  label:"Lyssnar", msg:"Jag är här och lyssnar. Vad vill du göra?" },
  { key:"think", label:"Tänker", msg:"Ett ögonblick — jag letar upp rätt kund åt dig…" },
  { key:"talk",  label:"Pratar", msg:"Jag har fyllt i adress, yta och ROT-avdrag." },
  { key:"guide", label:"Vägleder", msg:"Följ mig — knappen du söker ligger här uppe." },
  { key:"happy", label:"Klart!", msg:"Klart! Projektet är uppe. Bra jobbat." },
  { key:"sleep", label:"Vilar", msg:"Vilar tills du behöver mig igen. Puffa när som." },
];

// map pointer position to a gaze direction
function gazeFrom(e, el){
  const r = el.getBoundingClientRect();
  const dx = (e.clientX - (r.left + r.width/2)) / (r.width/2);
  const dy = (e.clientY - (r.top + r.height/2)) / (r.height/2);
  const h = dx < -0.25 ? "left" : dx > 0.25 ? "right" : "";
  const v = dy < -0.25 ? "up" : dy > 0.25 ? "down" : "";
  if(v==="up"   && h) return "up"+h;
  if(v==="down" && h==="right") return "downright";
  return v || h || "center";
}

function Hero(){
  const [st, setSt] = useState("hello");
  const [look, setLook] = useState("center");
  const stageRef = useRef(null);
  const active = HERO_STATES.find(s=>s.key===st) || HERO_STATES[0];
  const gaze = (st==="idle" || st==="hello") ? look
             : st==="think" ? "upleft"
             : st==="guide" ? "upright" : "center";
  return (
    <div className="hero">
      <div className="hero-stage" ref={stageRef}
        onMouseMove={(e)=>setLook(gazeFrom(e, stageRef.current))}
        onMouseLeave={()=>setLook("center")}>
        <Avatar size={220} state={st} look={gaze} />
      </div>
      <div className="hero-side">
        <div className="hint">Renaida säger</div>
        <div className="bubble">{active.msg}</div>
        <div>
          <div className="hint" style={{marginBottom:10}}>Prova ett humör</div>
          <div className="chips">
            {HERO_STATES.map(s=>(
              <button key={s.key} className={"chip"+(s.key===st?" on":"")} onClick={()=>setSt(s.key)}>{s.label}</button>
            ))}
          </div>
        </div>
        <div className="hint" style={{marginTop:"auto"}}>Tips · rör muspekaren över Renaida — hon följer dig med blicken.</div>
      </div>
    </div>
  );
}

const GALLERY = [
  { st:"hello", look:"center", lab:"Hälsar", use:"Onboarding & första hej" },
  { st:"idle",  look:"center", lab:"Lyssnar", use:"Vilo-läge, väntar på dig" },
  { st:"think", look:"upleft", lab:"Tänker", use:"Hämtar & räknar i bakgrunden" },
  { st:"talk",  look:"center", lab:"Pratar", use:"Föreslår & förklarar" },
  { st:"guide", look:"upright",lab:"Vägleder", use:"Pekar mot nästa steg" },
  { st:"happy", look:"center", lab:"Klart!", use:"Bekräftar utfört jobb" },
  { st:"sleep", look:"center", lab:"Vilar", use:"Minimerad / offline" },
  { st:"guide", look:"left",   lab:"Tittar åt", use:"Blicken riktas mot UI" },
];

function Gallery(){
  return (
    <div className="gal">
      {GALLERY.map((g,i)=>(
        <div className="card" key={i}>
          <div className="stagec"><Avatar size={92} state={g.st} look={g.look} /></div>
          <div className="lab">{g.lab}</div>
          <div className="use">{g.use}</div>
        </div>
      ))}
    </div>
  );
}

// ── in-app onboarding demo ──
const STEPS = [
  { st:"hello", look:"center",  msg:"Hej! Jag är Renaida. Ska vi lägga upp ditt första projekt tillsammans?", pulse:false, added:false },
  { st:"guide", look:"upright", msg:"Ser du «Nytt projekt» uppe till höger? Den pulserar. Klicka så tar jag över resten.", pulse:true, added:false },
  { st:"think", look:"upleft",  msg:"Fint. Jag fyller i kund, adress och ROT-avdrag medan vi går…", pulse:false, added:false },
  { st:"happy", look:"center",  msg:"Klart! Projektet «Kök · Vasastan» är uppe. Puffa mig när du vill vidare.", pulse:false, added:true },
];

function Demo(){
  const [i, setI] = useState(0);
  const step = STEPS[i];
  const next = ()=> setI(v=> (v+1) % STEPS.length);
  return (
    <div className="demo">
      <div className="app-nav">
        <div className="brand"><SkaraMark size={24}/> Renofine</div>
        <div className="links"><span className="act">Projekt</span><span>Inköp</span><span>Kunder</span></div>
        <div className="right">
          <button className={"newbtn"+(step.pulse?" pulse":"")}><span className="plus">+</span> Nytt projekt</button>
          <div className="avatar-chip"></div>
        </div>
      </div>
      <div className="app-body">
        <h3>Projekt</h3>
        <div className="sub">Allt du renoverar, på ett ställe.</div>
        {step.added ? (
          <div className="rows">
            <div className="row">
              <div className="dot"></div>
              <div>
                <div className="rname">Kök · Vasastan</div>
                <div className="rmeta">Anna Lindqvist · Upplandsgatan 12 · ROT aktiv</div>
              </div>
              <div className="rstatus">Nyss skapat</div>
            </div>
          </div>
        ) : (
          <div className="empty">
            <div className="big">Inga projekt ännu</div>
            Renaida hjälper dig igång på under en minut.
          </div>
        )}
      </div>

      <div className="launcher">
        <div className="pod"><Avatar size={54} state={step.st} look={step.look} /></div>
        <div className="say">
          {step.msg}
          <div className="step-nav">
            <button className="skip" onClick={()=>setI(0)}>Börja om</button>
            <button className="next" onClick={next}>{i===STEPS.length-1?"Kör igen":"Nästa"}</button>
            <span className="prog">{i+1} / {STEPS.length}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  return (
    <div className="wrap">
      <div className="mono">Renofine · assistent</div>
      <h1>Renaida</h1>
      <p className="lede"><b>Skåran blir ett öga.</b> Renofines logotyp får liv som en assistent som hälsar, tänker, pekar och firar — och hjälper användaren att fylla appen och hitta rätt.</p>

      <div className="namebox">
        <b>Om namnet — ja, det bär.</b> «Renaida» håller <i>Ren-</i> från Renofine och gömmer <i>AI</i> i mitten (Ren·<b>ai</b>·da). Det låter mjukt och mänskligt, är lätt att säga och unikt nog att äga. En liten varning: uttalet kan glida mot «Renata/Aida» — värt ett snabbt högt-test med teamet.</div>

      <section>
        <h2>Levande avatar</h2>
        <p className="sec-sub">Samma disc och utskurna fals som marken — pupillen blinkar, följer blicken och byter uttryck efter läge.</p>
        <Hero />
      </section>

      <section>
        <h2>Uttryck</h2>
        <p className="sec-sub">Ett litet men komplett känslobibliotek. Varje läge kopplas till ett tillfälle i appen.</p>
        <Gallery />
      </section>

      <section>
        <h2>I appen</h2>
        <p className="sec-sub">Renaida dockar i hörnet och lotsar användaren steg för steg. Klicka «Nästa» för att spela igenom onboardingen.</p>
        <Demo />
      </section>

      <section>
        <h2>Så byggs hon</h2>
        <p className="sec-sub">Inget nytt ritat — bara marken, tolkad. Falsen är ögonhålan, en pupill placeras i, resten är rörelse.</p>
        <div className="constr">
          <div className="c">
            <SkaraMark size={80} color="#1A1A17" />
            <div className="cap"><b>Marken</b><br/>Skåra — disc med utskuren fals</div>
          </div>
          <div className="c">
            <Avatar size={100} state="idle" look="center" />
            <div className="cap"><b>Avataren</b><br/>Falsen → ögonhåla · pupill + glimt</div>
          </div>
          <div className="c">
            <div className="swatches">
              <div className="sw" style={{background:"#2F5D4E"}}></div>
              <div className="sw" style={{background:"#1A1A17"}}></div>
              <div className="sw" style={{background:"#FAFAF7"}}></div>
              <div className="sw" style={{background:"#A8845C"}}></div>
            </div>
            <div className="cap"><b>Palett</b><br/>Grön · ink · paper · gold — inga nya färger</div>
          </div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
