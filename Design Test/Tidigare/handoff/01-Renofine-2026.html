<!doctype html>
<html lang="sv" data-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Renofine · 2026 Design Exploration</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; height: 100%; }
  /* Each artboard is its own themed world */
  .themed { isolation: isolate; }
  .themed[data-scope="paper"]    { --bg: oklch(97.4% 0.004 85); }
  /* Artboard frames get a hairline */
  [data-dc-slot] .dc-card > .artboard { border: 1px solid oklch(88% 0.01 85); border-radius: 10px; overflow: hidden; box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="source/design-canvas.jsx"></script>
<script type="text/babel" src="source/shared.jsx"></script>
<script type="text/babel" src="source/dashboard.jsx"></script>
<script type="text/babel" src="source/project-detail.jsx"></script>
<script type="text/babel" src="source/floormap.jsx"></script>
<script type="text/babel" src="source/tasks.jsx"></script>
<script type="text/babel" src="source/purchases.jsx"></script>
<script type="text/babel" src="source/client-view.jsx"></script>
<script type="text/babel" src="source/timeline.jsx"></script>

<script type="text/babel">
/* global React, ReactDOM, DesignCanvas, DCSection, DCArtboard, DCPostIt,
          Dashboard, ProjectDetail, FloorMap, Tasks, Purchases, ClientView, Timeline */

// A themed artboard scope — sets data-theme on a wrapper so every CSS var
// inside resolves from that palette, independent of the page <html> theme.
function Frame({ theme = "paper", width = 1280, height = 820, children }) {
  return (
    <div data-theme={theme} className="themed artboard" style={{ width, height, overflow: "hidden", background: "var(--bg)", boxSizing: "border-box" }}>
      {children}
    </div>
  );
}

function App() {
  const DASH_W = 1280, DASH_H = 880;
  const WIDE_W = 1280, WIDE_H = 820;
  const CLIENT_W = 1080, CLIENT_H = 1040;
  const PLAN_W = 1280, PLAN_H = 820;

  return (
    <DesignCanvas>

      {/* ————————————————————————————————————————— */}
      <DCSection id="0-intro" title="Renofine · 2026"
        subtitle="A hi-fi redesign exploration in the spirit of Linear + Arc + Are.na. Swedish-calm, editorial, tool-first. Three token themes (Paper / Charcoal / Blueprint) per surface — all driven by the same component tree.">
        <DCArtboard id="legend" label="Design system · at a glance" width={1000} height={520}>
          <Frame theme="paper" width={1000} height={520}>
            <div style={{ padding: 36, height: "100%", boxSizing: "border-box", display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 40 }}>
              <div>
                <div className="mono" style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--fg-subtle)", marginBottom: 12 }}>System · Renofine Studio</div>
                <h1 className="font-display" style={{ fontSize: 48, fontWeight: 400, letterSpacing: "-0.028em", margin: 0, lineHeight: 1.08, paddingBottom: 4 }}>
                  Byggprojekt<br />som ritningar, inte kanban<span style={{ color: "var(--fg-subtle)" }}>.</span>
                </h1>
                <p style={{ fontSize: 14, color: "var(--fg-muted)", marginTop: 24, lineHeight: 1.55, maxWidth: 440 }}>
                  Inter Tight för UI, Fraunces för editoriella moment, JetBrains Mono
                  för siffror och mätningar. Palett i <code className="mono">oklch()</code> — tre teman
                  (Paper · Charcoal · Blueprint) delar samma tokens och bytas med ett attribut.
                </p>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                <div>
                  <div className="mono" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--fg-subtle)", marginBottom: 10 }}>Palette</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6 }}>
                    {[
                      ["bg", "oklch(97.4% 0.004 85)"],
                      ["surface", "oklch(99.5% 0.002 85)"],
                      ["ink", "oklch(22% 0.01 260)"],
                      ["primary", "oklch(52% 0.09 155)"],
                      ["warn", "oklch(72% 0.12 75)"],
                      ["danger", "oklch(58% 0.14 25)"],
                    ].map(([n, c]) => (
                      <div key={n} style={{ textAlign: "center" }}>
                        <div style={{ height: 54, background: c, borderRadius: 6, border: "1px solid oklch(88% 0.01 85)" }} />
                        <div className="mono" style={{ fontSize: 10, color: "var(--fg-subtle)", marginTop: 5 }}>{n}</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div>
                  <div className="mono" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--fg-subtle)", marginBottom: 10 }}>Type</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <div className="font-display" style={{ fontSize: 34, fontWeight: 400, letterSpacing: "-0.025em", lineHeight: 1 }}>Vasastan · 118 m²</div>
                    <div style={{ fontSize: 15, fontWeight: 500 }}>Inter Tight — UI layers, labels, tables</div>
                    <div className="mono" style={{ fontSize: 12 }}>JetBrains Mono — 5 120 mm · 62% · kr</div>
                  </div>
                </div>
              </div>
            </div>
          </Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Dashboard */}
      <DCSection id="1-dashboard" title="1 · Start / Översikt"
        subtitle="Landing page when a PM opens Renofine. Three directions: editorial dense, Linear-ops table, and portfolio/card-led.">
        <DCArtboard id="dash-a" label="A · Editorial (Paper)" width={DASH_W} height={DASH_H}>
          <Frame theme="paper" width={DASH_W} height={DASH_H}><Dashboard variant="A" /></Frame>
        </DCArtboard>
        <DCArtboard id="dash-b" label="B · Ops Console (Charcoal)" width={DASH_W} height={DASH_H}>
          <Frame theme="charcoal" width={DASH_W} height={DASH_H}><Dashboard variant="B" /></Frame>
        </DCArtboard>
        <DCArtboard id="dash-c" label="C · Portfolio (Blueprint)" width={DASH_W} height={DASH_H}>
          <Frame theme="blueprint" width={DASH_W} height={DASH_H}><Dashboard variant="C" /></Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Project detail */}
      <DCSection id="2-project" title="2 · Projekt · Översikt"
        subtitle="One project — the main workspace hub. Editorial single-column vs split-rail with floor-plan preview.">
        <DCArtboard id="proj-a" label="A · Editorial hub" width={WIDE_W} height={WIDE_H}>
          <Frame theme="paper" width={WIDE_W} height={WIDE_H}><ProjectDetail variant="A" /></Frame>
        </DCArtboard>
        <DCArtboard id="proj-b" label="B · Split with floor-plan" width={WIDE_W} height={WIDE_H}>
          <Frame theme="paper" width={WIDE_W} height={WIDE_H}><ProjectDetail variant="B" /></Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Floor plan */}
      <DCSection id="3-plan" title="3 · Planlösning · Space planner"
        subtitle="The showpiece — ritningsverktyg med AI från foto, kopplade arbeten, dimensioner. Paper vs Charcoal pro-tool.">
        <DCArtboard id="plan-a" label="A · Blueprint (Paper)" width={PLAN_W} height={PLAN_H}>
          <Frame theme="paper" width={PLAN_W} height={PLAN_H}><FloorMap variant="A" /></Frame>
        </DCArtboard>
        <DCArtboard id="plan-b" label="B · Pro-tool (Charcoal)" width={PLAN_W} height={PLAN_H}>
          <Frame theme="charcoal" width={PLAN_W} height={PLAN_H}><FloorMap variant="A" /></Frame>
        </DCArtboard>
        <DCArtboard id="plan-c" label="C · Blueprint theme" width={PLAN_W} height={PLAN_H}>
          <Frame theme="blueprint" width={PLAN_W} height={PLAN_H}><FloorMap variant="A" /></Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Tasks */}
      <DCSection id="4-tasks" title="4 · Arbeten"
        subtitle="Kanban board vs dense list. Same data, different rhythms.">
        <DCArtboard id="tasks-a" label="A · Tavla (Kanban)" width={WIDE_W} height={WIDE_H}>
          <Frame theme="paper" width={WIDE_W} height={WIDE_H}><Tasks variant="A" /></Frame>
        </DCArtboard>
        <DCArtboard id="tasks-b" label="B · Lista (dense)" width={WIDE_W} height={WIDE_H}>
          <Frame theme="paper" width={WIDE_W} height={WIDE_H}><Tasks variant="B" /></Frame>
        </DCArtboard>
        <DCArtboard id="tasks-c" label="C · Tavla (Charcoal)" width={WIDE_W} height={WIDE_H}>
          <Frame theme="charcoal" width={WIDE_W} height={WIDE_H}><Tasks variant="A" /></Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Timeline */}
      <DCSection id="5-timeline" title="5 · Tidslinje"
        subtitle="Phase-based Gantt with week scale and today marker.">
        <DCArtboard id="tl-a" label="A · Gantt (Paper)" width={WIDE_W} height={720}>
          <Frame theme="paper" width={WIDE_W} height={720}><Timeline /></Frame>
        </DCArtboard>
        <DCArtboard id="tl-b" label="B · Gantt (Blueprint)" width={WIDE_W} height={720}>
          <Frame theme="blueprint" width={WIDE_W} height={720}><Timeline /></Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Purchases */}
      <DCSection id="6-purchases" title="6 · Inköp & material"
        subtitle="Ledger with approval queue, supplier column, delivery status.">
        <DCArtboard id="pur-a" label="A · Ledger (Paper)" width={WIDE_W} height={1100}>
          <Frame theme="paper" width={WIDE_W} height={1100}><Purchases /></Frame>
        </DCArtboard>
        <DCArtboard id="pur-b" label="B · Ledger (Charcoal)" width={WIDE_W} height={1100}>
          <Frame theme="charcoal" width={WIDE_W} height={1100}><Purchases /></Frame>
        </DCArtboard>
      </DCSection>

      {/* ————————————————————————————————————————— Client */}
      <DCSection id="7-client" title="7 · Klientrapport"
        subtitle="The magic moment. Read-only page a PM shares with the home-owner. Warm, confident, editorial.">
        <DCArtboard id="cli-a" label="A · Rapport (Paper)" width={CLIENT_W} height={CLIENT_H}>
          <Frame theme="paper" width={CLIENT_W} height={CLIENT_H}><ClientView /></Frame>
        </DCArtboard>
        <DCArtboard id="cli-b" label="B · Rapport (Blueprint)" width={CLIENT_W} height={CLIENT_H}>
          <Frame theme="blueprint" width={CLIENT_W} height={CLIENT_H}><ClientView /></Frame>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
