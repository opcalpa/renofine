<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renofine · Logotyp · Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#F4EFE6; font-family: 'Inter Tight', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="source/logo/design-canvas.jsx"></script>
<script type="text/babel" src="source/logo/marks.jsx"></script>
<script type="text/babel" src="source/logo/marks-v2.jsx"></script>
<script type="text/babel" src="source/logo/finals.jsx"></script>

<script type="text/babel">
const Canvas = window.DesignCanvas;
const Sect = window.DCSection;
const Board = window.DCArtboard;
const { FinalDirection, FinalCompare } = window;
const { MarkSkara, MarkRf } = window;

function App() {
  return (
    <Canvas title="Renofine · logotyp · final" subtitle="Kapitäl R + Fraunces · välj mellan Skåra och Rf-monogram">
      <Sect id="compare" title="Sida vid sida" subtitle="Direkt jämförelse — välj utifrån vilken som känns mest 'Renofine'.">
        <Board id="cmp" label="Beslut · jämförelse" width={1200} height={560}>
          <FinalCompare/>
        </Board>
      </Sect>

      <Sect id="alt-a" title="Alt A · Skåra" subtitle="Distinkt geometrisk mark — stark på favicon, ingen kollision.">
        <Board id="alt-a-board" label="Renofine + Skåra · full presentation" width={1200} height={780}>
          <FinalDirection
            Mark={MarkSkara}
            kicker="Alt A · Skåra"
            name="Skåra"
            descriptor="Cirkel med utskuren fals"
            rationale="Skiva med en exakt utskuren skåra — refererar precision och måttsatta detaljer (en fals i sektion). Stark på 16px favicon, ingen kollision med kända loggor."
          />
        </Board>
      </Sect>

      <Sect id="alt-b" title="Alt B · Rf-monogram" subtitle="Klassisk monogram-ruta med 'Rf' i Fraunces — din ursprungliga favorit.">
        <Board id="alt-b-board" label="Renofine + Rf-monogram · full presentation" width={1200} height={780}>
          <FinalDirection
            Mark={MarkRf}
            kicker="Alt B · Rf-monogram"
            name="Rf"
            descriptor="Solid ruta med Fraunces 'Rf'"
            rationale="Klassiskt monogram — 'Rf' i Fraunces medium i en rundad ruta. Direkt läsbart, knyter direkt till namnet. Mest återhållsamt, perfekt för app-ikon och favicon."
          />
        </Board>
      </Sect>
    </Canvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
