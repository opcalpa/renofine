<!doctype html>
<html lang="sv" data-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Renofine · Dashboard · Full spec</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; height: 100%; }
  .themed { isolation: isolate; }
  [data-dc-slot] .dc-card > .artboard { border: 1px solid oklch(88% 0.01 85); border-radius: 10px; overflow: hidden; box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="dashboard-states.jsx"></script>
<script type="text/babel" src="handoff.jsx"></script>

<script type="text/babel">
/* global React, ReactDOM, DesignCanvas, DCSection, DCArtboard,
          Dashboard, DashEmpty, DashLoading, DashHover,
          DashNotifications, DashModalNewProject, DashModalInvite,
          DashMobile, Handoff */

function Frame({ width, height, children }) {
  return (
    <div data-theme="paper" className="themed" style={{ width, height, overflow: "hidden", background: "var(--bg)", boxSizing: "border-box" }}>
      {children}
    </div>
  );
}

const W = 1280, H = 880;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="0-canonical" title="Dashboard · canonical"
        subtitle="Paper theme locked in. The state every returning user sees when projects exist.">
        <DCArtboard id="canon" label="Canonical (signed-in, has projects)" width={W} height={H}>
          <Frame width={W} height={H}><Dashboard variant="A" /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="1-states" title="1 · Data states"
        subtitle="Empty, loading, and first-run onboarding. Every state uses the same grid so the layout doesn't jump when data arrives.">
        <DCArtboard id="empty" label="Empty · new user, no projects" width={W} height={H}>
          <Frame width={W} height={H}><DashEmpty /></Frame>
        </DCArtboard>
        <DCArtboard id="loading" label="Loading · skeleton (shimmer)" width={W} height={H}>
          <Frame width={W} height={H}><DashLoading /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="2-interactions" title="2 · Interaction states"
        subtitle="Hover, focus, selected, disabled — the interaction vocabulary. Use these exact styles everywhere.">
        <DCArtboard id="interact" label="Buttons, inputs, rows" width={W} height={960}>
          <Frame width={W} height={960}><DashHover /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="3-modals" title="3 · Core modals & overlays"
        subtitle="Primary actions the Dashboard triggers. Modals are full document portals — ESC closes, focus trapped, scroll locked.">
        <DCArtboard id="modal-new" label="Modal · Nytt projekt (step 1/3)" width={W} height={H}>
          <Frame width={W} height={H}><DashModalNewProject /></Frame>
        </DCArtboard>
        <DCArtboard id="modal-invite" label="Modal · Bjud in team & klient" width={W} height={H}>
          <Frame width={W} height={H}><DashModalInvite /></Frame>
        </DCArtboard>
        <DCArtboard id="notif" label="Panel · Inkorg (bell)" width={W} height={H}>
          <Frame width={W} height={H}><DashNotifications /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="4-mobile" title="4 · Mobile breakpoint (375×812)"
        subtitle="Same data, re-stacked. Horizontal stat-scroll, bottom tab bar, condensed project rows.">
        <DCArtboard id="mobile-home" label="Mobile · Start" width={375} height={812}>
          <Frame width={375} height={812}><DashMobile /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="5-handoff" title="5 · Dev handoff"
        subtitle="Tokens, component contracts, accessibility, and a two-week ship list. Copy-paste into your repo PR description.">
        <DCArtboard id="handoff" label="Handoff sheet" width={1100} height={1600}>
          <Frame width={1100} height={1600}><Handoff /></Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
